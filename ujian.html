<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lembar Ujian Online Siswa</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #f4f6f9;
      user-select: none; /* Mencegah seleksi teks / copy paste */
      -webkit-user-select: none;
    }
    .card-custom {
      border-radius: 12px;
      border: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    .timer-box {
      font-size: 1.25rem;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .btn-number {
      width: 45px;
      height: 45px;
      margin: 3px;
      font-weight: bold;
      border-radius: 8px;
    }
    .option-item {
      cursor: pointer;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 10px;
      transition: all 0.2s ease;
    }
    .option-item:hover {
      background-color: #e9ecef;
    }
    .option-item.selected {
      background-color: #d1e7dd;
      border-color: #0f5132;
      font-weight: bold;
    }
    .soal-text {
      font-size: 1.1rem;
      line-height: 1.6;
    }
  </style>

  <script src="config.js"></script>
</head>
<body>

<div class="container py-3 py-md-4">
  
  <!-- HEADER IDENTITAS UJIAN & SISWA -->
  <div class="card card-custom p-3 bg-white mb-3">
    <div class="row align-items-center">
      <div class="col-md-7 mb-2 mb-md-0">
        <div class="d-flex align-items-center gap-2 mb-1">
          <span class="badge bg-primary fs-6" id="txtJenisUjian">Ujian Online</span>
          <span class="badge bg-success fs-6" id="txtMapelUjian">Mata Pelajaran: -</span>
        </div>
        <h5 class="fw-bold mb-0 text-dark" id="txtKodeUjian">Kode Ujian: -</h5>
        <small class="text-muted">
          Siswa: <strong id="txtNamaSiswa" class="text-dark">-</strong> | 
          No/NIS: <strong id="txtNoPeserta" class="text-dark">-</strong> | 
          Kelas: <strong id="txtKelasSiswa" class="text-dark">-</strong>
        </small>
      </div>

      <div class="col-md-5 text-md-end">
        <div class="p-2 bg-light border rounded d-inline-block text-center">
          <small class="text-muted d-block fw-bold" style="font-size: 0.75rem;">SISA WAKTU UJIAN</small>
          <div class="timer-box text-danger" id="txtTimer">00:00:00</div>
        </div>
      </div>
    </div>
  </div>

  <!-- CONTAINER UTAMA SOAL & NAVIGASI -->
  <div class="row g-3">
    
    <!-- KOLOM KIRI: AREA PERTANYAAN SOAL -->
    <div class="col-lg-8">
      <div class="card card-custom p-4 bg-white min-vh-50 d-flex flex-column justify-content-between h-100">
        <div>
          <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
            <h5 class="fw-bold text-primary mb-0" id="labelNomorSoal">Soal No. 1</h5>
            <span class="badge bg-secondary" id="labelTipeSoal">PG</span>
          </div>

          <!-- ISIAN PERTANYAAN -->
          <div class="soal-text mb-4" id="areaPertanyaan">
            Sedang memuat soal...
          </div>

          <!-- CONTAINER OPSI JAWABAN PG / INPUT ESSAI -->
          <div id="areaOpsiJawaban"></div>
        </div>

        <!-- TOMBOL NAVIGASI SOAL -->
        <div class="d-flex justify-content-between align-items-center border-top pt-3 mt-4">
          <button class="btn btn-outline-secondary fw-bold" id="btnPrev" onClick="soalSebelumnya()">
            &laquo; Sebelumnya
          </button>
          
          <button class="btn btn-primary fw-bold" id="btnNext" onClick="soalBerikutnya()">
            Berikutnya &raquo;
          </button>
        </div>
      </div>
    </div>

    <!-- KOLOM KANAN: NAVIGASI NOMOR SOAL & SUBMIT -->
    <div class="col-lg-4">
      <div class="card card-custom p-3 bg-white">
        <h6 class="fw-bold mb-3 border-bottom pb-2 text-center">Navigasi Soal</h6>
        
        <!-- GRID TOMBOL NOMOR SOAL -->
        <div class="d-flex flex-wrap justify-content-center mb-3" id="containerNomorSoal"></div>

        <div class="p-2 bg-light rounded small mb-3">
          <div class="d-flex justify-content-around">
            <span><span class="badge bg-success">N</span> Terjawab</span>
            <span><span class="badge bg-outline-secondary text-dark border">N</span> Belum</span>
            <span><span class="badge bg-primary">N</span> Aktif</span>
          </div>
        </div>

        <button class="btn btn-danger btn-lg w-100 fw-bold" onClick="konfirmasiSelesaiUjian()">
          Selesai & Kirim Ujian
        </button>
      </div>
    </div>

  </div>
</div>

<!-- MODAL KONFIRMASI SELESAI -->
<div class="modal fade" id="modalSelesai" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-warning text-dark">
        <h5 class="modal-title fw-bold">Konfirmasi Selesai Ujian</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="mb-2">Apakah Anda yakin ingin menyelesaikan dan mengirimkan seluruh jawaban ujian ini?</p>
        <div id="infoPeringatanBelumDiisi" class="alert alert-info small mb-0"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary fw-bold" data-bs-dismiss="modal">Kembali Periksa</button>
        <button type="button" class="btn btn-danger fw-bold" id="btnKirimUjianFinal" onClick="kirimJawabanKeServer()">Ya, Kirim Jawaban</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  let listSoal = [];
  let jawabanSiswa = {};
  let indexAktif = 0;
  let sisaWaktuDetik = 0;
  let timerInterval = null;
  let modalSelesaiInstance = null;
  let mataPelajaranUjian = ""; // Menyimpan nama mata pelajaran

  async function apiPost(payload) {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error("Gagal terhubung ke server.");
    return await res.json();
  }

  document.addEventListener("DOMContentLoaded", async function() {
    modalSelesaiInstance = new bootstrap.Modal(document.getElementById('modalSelesai'));

    // AMBIL DATA SISWA DARI SESSION
let namaSiswa = sessionStorage.getItem("siswa_nama") || "Siswa Dummy";
let noPeserta = sessionStorage.getItem("siswa_no_peserta") || "12345";
let kelasSiswa = sessionStorage.getItem("siswa_kelas") || "XII";
let kodeUjian = sessionStorage.getItem("siswa_kode_ujian") || "UJIAN-01"; // Sesuaikan dengan kode ujian valid di database

// Simpan otomatis agar fungsi simpan jawaban lokal tetap berjalan mulus
sessionStorage.setItem("siswa_nama", namaSiswa);
sessionStorage.setItem("siswa_no_peserta", noPeserta);
sessionStorage.setItem("siswa_kelas", kelasSiswa);
sessionStorage.setItem("siswa_kode_ujian", kodeUjian);

    if (!namaSiswa || !noPeserta || !kodeUjian) {
      alert("Sesi login ujian tidak ditemukan. Anda akan dikembalikan ke halaman awal.");
      window.location.href = "index.html";
      return;
    }

    document.getElementById("txtNamaSiswa").innerText = namaSiswa;
    document.getElementById("txtNoPeserta").innerText = noPeserta;
    document.getElementById("txtKelasSiswa").innerText = kelasSiswa || "-";
    document.getElementById("txtKodeUjian").innerText = "Kode: " + kodeUjian;

    // RESTORE JAWABAN LOKAL JIKA ADA
    const savedJawaban = localStorage.getItem(`jawaban_${kodeUjian}_${noPeserta}`);
    if (savedJawaban) {
      try { jawabanSiswa = JSON.parse(savedJawaban); } catch(e){}
    }

    await muatPengaturanDanSoal(kodeUjian);
    mulaiTimerUjian();
  });

  async function muatPengaturanDanSoal(kode) {
    try {
      // 1. MUAT PENGATURAN PARAMETER UJIAN
      const cfgRes = await apiPost({ action: "getPengaturan", kode: kode });
      if (cfgRes.status === "success" && cfgRes.data) {
        const cfg = Array.isArray(cfgRes.data) ? (cfgRes.data[0] || {}) : cfgRes.data;
        
        // TAMPILKAN NAMA MAPEL & JENIS UJIAN
        mataPelajaranUjian = cfg.mata_pelajaran || cfg.mapel || "";
        document.getElementById("txtMapelUjian").innerText = mataPelajaranUjian ? "Mapel: " + mataPelajaranUjian : "Mata Pelajaran Ujian";
        document.getElementById("txtJenisUjian").innerText = cfg.jenis_ujian || "Ujian Online";

        // DURASI WAKTU (DALAM MENIT -> DETIK)
        const durasiMenit = parseInt(cfg.durasi) || 90;
        
        // CEK TIMESTAMPS AWAL / SISAKAN WAKTU DARI LOCAL STORAGE
        const keyStartTime = `startTime_${kode}_${sessionStorage.getItem("siswa_no_peserta")}`;
        let startTime = localStorage.getItem(keyStartTime);
        if (!startTime) {
          startTime = Date.now();
          localStorage.setItem(keyStartTime, startTime);
        }

        const elapsedDetik = Math.floor((Date.now() - parseInt(startTime)) / 1000);
        sisaWaktuDetik = (durasiMenit * 60) - elapsedDetik;

        if (sisaWaktuDetik <= 0) {
          sisaWaktuDetik = 0;
        }
      }

      // 2. MUAT LIST SOAL UJIAN (Menggunakan action getSoalSiswa)
      const soalRes = await apiPost({ action: "getSoalSiswa", kode: kode, kode_soal: kode });
      if (soalRes.status === "success" && soalRes.soal && soalRes.soal.length > 0) {
        listSoal = soalRes.soal;
        renderNavigasiNomor();
        tampilkanSoal(0);
      } else {
        alert("Bank soal untuk ujian ini belum siap/kosong. Hubungi proktor/guru.");
      }

    } catch (e) {
      alert("Gagal memuat data ujian: " + e.message);
    }
  }

  function renderNavigasiNomor() {
    const container = document.getElementById("containerNomorSoal");
    container.innerHTML = "";

    listSoal.forEach((soal, idx) => {
      const isAnswered = jawabanSiswa[idx + 1] !== undefined && jawabanSiswa[idx + 1] !== "";
      const isCurrent = idx === indexAktif;

      let btnClass = "btn-outline-secondary";
      if (isAnswered) btnClass = "btn-success";
      if (isCurrent) btnClass = "btn-primary";

      const btn = document.createElement("button");
      btn.className = `btn btn-number ${btnClass}`;
      btn.innerText = idx + 1;
      btn.onclick = () => tampilkanSoal(idx);

      container.appendChild(btn);
    });
  }

  function tampilkanSoal(idx) {
    if (idx < 0 || idx >= listSoal.length) return;
    indexAktif = idx;

    const soal = listSoal[idx];
    const noSoalKey = idx + 1;

    document.getElementById("labelNomorSoal").innerText = `Soal No. ${noSoalKey} dari ${listSoal.length}`;
    document.getElementById("labelTipeSoal").innerText = (soal.tipe || "PG").toUpperCase();
    document.getElementById("areaPertanyaan").innerHTML = soal.pertanyaan || "";

    const areaOpsi = document.getElementById("areaOpsiJawaban");
    areaOpsi.innerHTML = "";

    const tipe = (soal.tipe || "PG").toUpperCase();

    if (tipe === "PG") {
      const opsiList = [
        { key: "A", text: soal.opA || soal.op_a || "" },
        { key: "B", text: soal.opB || soal.op_b || "" },
        { key: "C", text: soal.opC || soal.op_c || "" },
        { key: "D", text: soal.opD || soal.op_d || "" }
      ];

      const valTerpilih = jawabanSiswa[noSoalKey] || "";

      opsiList.forEach(op => {
        if (!op.text) return;
        const isSelected = valTerpilih === op.key;
        const div = document.createElement("div");
        div.className = `option-item d-flex align-items-center ${isSelected ? 'selected' : ''}`;
        div.onclick = () => pilihOpsiPG(noSoalKey, op.key);

        div.innerHTML = `
          <div class="me-3 border rounded-circle text-center fw-bold ${isSelected ? 'bg-success text-white' : 'bg-light'}" style="width: 32px; height: 32px; line-height: 30px;">
            ${op.key}
          </div>
          <div>${op.text}</div>
        `;
        areaOpsi.appendChild(div);
      });

    } else {
      // SOAL ESSAI
      const valTerisi = jawabanSiswa[noSoalKey] || "";
      areaOpsi.innerHTML = `
        <div class="mb-3">
          <label class="form-label fw-bold">Ketikkan Jawaban Uraian / Essai Anda:</label>
          <textarea class="form-control" rows="5" placeholder="Tuliskan jawaban lengkap di sini..." oninput="simpanJawabanEssai(${noSoalKey}, this.value)">${valTerisi}</textarea>
        </div>
      `;
    }

    // UPDATE STATE TOMBOL PREV/NEXT
    document.getElementById("btnPrev").disabled = (idx === 0);
    document.getElementById("btnNext").innerText = (idx === listSoal.length - 1) ? "Selesai" : "Berikutnya \u00BB";

    renderNavigasiNomor();
  }

  function pilihOpsiPG(noSoalKey, opsiKey) {
    jawabanSiswa[noSoalKey] = opsiKey;
    simpanJawabanLokal();
    tampilkanSoal(indexAktif);
  }

  function simpanJawabanEssai(noSoalKey, teksVal) {
    jawabanSiswa[noSoalKey] = teksVal.trim();
    simpanJawabanLokal();
    renderNavigasiNomor();
  }

  function simpanJawabanLokal() {
    const kode = sessionStorage.getItem("siswa_kode_ujian");
    const noPeserta = sessionStorage.getItem("siswa_no_peserta");
    localStorage.setItem(`jawaban_${kode}_${noPeserta}`, JSON.stringify(jawabanSiswa));
  }

  function soalSebelumnya() {
    if (indexAktif > 0) tampilkanSoal(indexAktif - 1);
  }

  function soalBerikutnya() {
    if (indexAktif < listSoal.length - 1) {
      tampilkanSoal(indexAktif + 1);
    } else {
      konfirmasiSelesaiUjian();
    }
  }

  function mulaiTimerUjian() {
    updateDisplayTimer();
    timerInterval = setInterval(() => {
      sisaWaktuDetik--;
      if (sisaWaktuDetik <= 0) {
        clearInterval(timerInterval);
        sisaWaktuDetik = 0;
        updateDisplayTimer();
        alert("Waktu ujian telah habis! Jawaban Anda akan dikirimkan secara otomatis.");
        kirimJawabanKeServer();
      } else {
        updateDisplayTimer();
      }
    }, 1000);
  }

  function updateDisplayTimer() {
    const jam = Math.floor(sisaWaktuDetik / 3600);
    const menit = Math.floor((sisaWaktuDetik % 3600) / 60);
    const detik = sisaWaktuDetik % 60;

    const pad = (n) => String(n).padStart(2, '0');
    document.getElementById("txtTimer").innerText = `${pad(jam)}:${pad(menit)}:${pad(detik)}`;
  }

  function konfirmasiSelesaiUjian() {
    let terisi = 0;
    listSoal.forEach((_, idx) => {
      if (jawabanSiswa[idx + 1] !== undefined && jawabanSiswa[idx + 1] !== "") terisi++;
    });

    const sisa = listSoal.length - terisi;
    const boxInfo = document.getElementById("infoPeringatanBelumDiisi");

    if (sisa > 0) {
      boxInfo.className = "alert alert-warning small mb-0";
      boxInfo.innerText = `Masih ada ${sisa} nomor soal yang belum Anda jawab. Anda yakin ingin menyelesaikan ujian sekarang?`;
    } else {
      boxInfo.className = "alert alert-success small mb-0";
      boxInfo.innerText = `Seluruh ${listSoal.length} soal telah selesai dijawab dengan lengkap!`;
    }

    modalSelesaiInstance.show();
  }

  async function kirimJawabanKeServer() {
    const btn = document.getElementById("btnKirimUjianFinal");
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Mengirim...`;

    const kode = sessionStorage.getItem("siswa_kode_ujian");
    const noPeserta = sessionStorage.getItem("siswa_no_peserta");
    const namaSiswa = sessionStorage.getItem("siswa_nama");
    const kelasSiswa = sessionStorage.getItem("siswa_kelas");

    const payload = {
      action: "simpanJawabanSiswa",
      kode_soal: kode,
      no_peserta: noPeserta,
      nama: namaSiswa,
      kelas: kelasSiswa,
      mata_pelajaran: mataPelajaranUjian, // DENGAN MATA PELAJARAN
      jawaban: jawabanSiswa
    };

    try {
      const result = await apiPost(payload);
      if (result.status === "success") {
        alert("Jawaban ujian Anda berhasil terkirim dan disimpan!");
        localStorage.removeItem(`jawaban_${kode}_${noPeserta}`);
        localStorage.removeItem(`startTime_${kode}_${noPeserta}`);
        sessionStorage.clear();
        window.location.href = "index.html";
      } else {
        alert("Gagal mengirim jawaban: " + result.message);
        btn.disabled = false;
        btn.innerHTML = "Ya, Kirim Jawaban";
      }
    } catch (e) {
      alert("Terjadi kesalahan koneksi saat mengirim jawaban: " + e.message);
      btn.disabled = false;
      btn.innerHTML = "Ya, Kirim Jawaban";
    }
  }
</script>
</body>
</html>
